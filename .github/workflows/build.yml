name: Build unsigned IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project RunBeat.xcodeproj \
            -scheme RunBeat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/RunBeat.app"
          test -d "$APP_PATH"
          rm -rf Payload RunBeat-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r RunBeat-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RunBeat-unsigned.ipa
          path: RunBeat-unsigned.ipa
          if-no-files-found: error
